#  USER-SERVICE CIRCUIT BREAKER
resilience4j.circuitbreaker.instances.user-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.user-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.user-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3


#  DRIVER-SERVICE CIRCUIT BREAKER
resilience4j.circuitbreaker.instances.driver-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.driver-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.driver-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.driver-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.driver-service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.driver-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.driver-service.automaticTransitionFromOpenToHalfOpenEnabled=true





